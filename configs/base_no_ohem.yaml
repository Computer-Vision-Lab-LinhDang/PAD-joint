backbone:
  name: fastvit_sa12
  pretrained: true
  in_chans: 8
  num_experts: 4
  top_k: 2
  grad_checkpoint: true
gabor:
  n_orientations: 8
  kernel_size: 31
  init_frequency: 0.12
identity_head:
  embed_dim: 256
  num_heads: 8
  grid_size: 14
  num_queries: 4
  stage3_dim: 256
  stage4_dim: 512
  mrl_dims:
  - 64
  - 128
  - 256
  num_classes: 5000
pad_head:
  stage1_dim: 64
  stage2_dim: 128
  dropout: 0.1
  pad_features_dim: 128
  pad_embedding_dim: 32
losses:
  arcface:
    margin: 0.5
    scale_phase1: 32.0
    scale_final: 48.0
    easy_margin: false
  supcon:
    temperature: 0.07
    contrast_mode: all
    base_temperature: 0.07
  orthogonality:
    eps: 1.0e-08
  alpha: 0.0
  beta: 0.0
  gamma: 0.05
  pad_bce_weight: 0.5
  pad_focal_alpha: 0.5
  pad_focal_gamma: 1.0
  pad_focal_weight: 1.0
  pad_hard_spoof_sensor_ids:
  - 6
  pad_hard_spoof_material_ids:
  - 4
  - 6
  - 7
  pad_hard_spoof_weight: 1.0
  pad_ohem_fraction: 0.25
  pad_ohem_weight: 1.0
  identity_supcon_weight: 0.9
  identity_arcface_weight: 0.1
optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
  lr_multipliers:
    gabor: 0.1
    backbone_embed: 1.0
    backbone_early: 1.0
    backbone_late: 1.0
    moe_experts: 2.0
    identity_head: 1.0
    pad_head_phase1: 1.0
    pad_head_phase2: 2.0
    arcface: 0.1
scheduler:
  name: CosineAnnealingLR
  T_max: 60
  eta_min: 1.0e-06
phases:
  phase1_epochs: 20
  phase2_epochs: 20
  phase3_epochs: 20
  total_epochs: 60
  phase1_warmup_delay: 5
  phase1_warmup_epochs: 5
  arcface_scale_init: 1.0
  arcface_margin_init: 0.0
  arcface_margin_target: 0.5
  warmup_epochs: 5
  alpha_target: 1.0
  beta_target: 0.02
  alpha_adv_target: 0.0
  arcface_scale_start: 32.0
  arcface_scale_end: 48.0
  moe_temp_phase1: 2.0
  moe_temp_phase2_end: 1.0
  moe_temp_phase3_end: 0.5
data:
  identity_data_root: /home/linhdang/workspace2/NIST-300-ds/combined_nist
  pad_data_root: /home/linhdang/workspace2/PAD-joint
  joint_data_root: ''
  identity_datasets:
  - nist_sd300
  pad_datasets:
  - LivDet2013
  - LivDet2015
  joint_datasets: []
  image_size: 224
  grayscale: true
  group_by_subject: true
  pk_p: 32
  pk_k: 2
  pad_batch_size: 64
  identity_num_views: 2
  identity_preset: fingerprint_hard
  num_workers: 8
  pin_memory: true
  val_split: 0.1
trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 60
  gradient_clip_val: 0.5
  accumulate_grad_batches: 2
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  deterministic: false
checkpoint:
  dirpath: checkpoints/
  filename: omfr-{epoch:03d}-{val/cascaded_IM:.4f}
  monitor: val/cascaded_IM
  mode: max
  save_top_k: 3
  save_last: true
logging:
  name: omfr
  save_dir: logs/
  version: null
  wandb:
    enabled: true
    project: omfr
    name: null
    log_model: false
evaluation:
  pad_threshold: 0.5
  far: 0.0001
  cmc_max_rank: 10
  mrl_eval_dims:
  - 64
  - 128
  - 256
export:
  output_dir: exports/
  onnx_opset: 17
  input_shape:
  - 1
  - 1
  - 224
  - 224
  simplify: true
