# configs/grand_fusion_sa24_padft.yaml
# ════════════════════════════════════════════════════════════════════
# OMFR — FastViT-SA24 | PAD-first 2-phase multi-task
#
#   Phase 1  PAD foundation for 15 epochs:
#            Balanced PAD batches, MS-TAH + full shared backbone, SupCon+BCE.
#   Phase 2  Identity integration for 25 epochs:
#            Alternating identity/PAD batches, identity loss ramps in, orth ramps in.
#
#   On transition: loader swap -> LR surgery
#   (identity head/ArcFace from x0.0 to x2.0, backbone stays trainable).
#
#   Checkpoints: best_phase1.ckpt (Phase-1 anchor / resume point) and
#   best_phase2.ckpt (deployable) are tracked SEPARATELY per phase.
# ════════════════════════════════════════════════════════════════════

backbone:
  name: fastvit_sa24            # ~20.6M — more capacity for 256-D MRL
  pretrained: true
  in_chans: 8
  num_experts: 4
  top_k: 2
  grad_checkpoint: true          # mandatory: 2 backbone graphs in Phase 2

gabor:
  n_orientations: 8
  kernel_size: 31
  init_frequency: 0.12

identity_head:
  embed_dim: 256
  num_heads: 8
  grid_size: 14
  num_queries: 4
  stage3_dim: 256
  stage4_dim: 512
  mrl_dims: [64, 128, 256]
  num_classes: 5000              # auto-detected at runtime

pad_head:
  stage1_dim: 64
  stage2_dim: 128
  align_ch: 128
  fusion_ch: 192
  embedding_dim: 64
  stage1_dw_kernel: 9
  stage2_dw_kernel: 5
  dropout: 0.1
  proj_dropout: 0.2              # dropout inside the MLP projector
  num_classes: 1
  pad_features_dim: 192
  pad_embedding_dim: 64

# Stage-2 PAD split-branch adaptation placeholder:
#   identity path -> identity_gabor -> shared FastViT -> identity_embedding
#   PAD path      -> MS-TAH on stage1/stage2 spatial texture features
# Scheduler wiring for this block is handled in the next training change.
pad_stage2:
  backbone_grad: true
  backbone_input: pad_gabor
  detach_backbone_features: false
  detach_routing_stats: true

# Sensor id 8 is the dataset fallback "Unknown". It is kept in the label
# space for backward-compatible checkpoints, but masked out of sensor-
# adversarial loss and not used for hard-spoof weighting.
num_sensors: 9
unknown_sensor_id: 8

losses:
  arcface:
    margin: 0.5
    scale_phase1: 32.0
    scale_final: 48.0
    easy_margin: false
    label_smoothing: 0.1
  supcon:
    temperature: 0.07
    contrast_mode: all
    base_temperature: 0.07
  orthogonality:
    eps: 1.0e-08
  alpha: 0.0
  beta: 0.0
  gamma: 0.05
  balancing_loss_weight: 0.005
  phase2_identity_loss_weight: 0.0
  phase2_balance_loss_weight: 0.0
  pad_bce_weight: 1.0
  pad_bce_phase_weight: 1.0
  # Identity-domain samples are live-only. Keep this small so it calibrates
  # PAD acceptance on FVC/NIST live prints without turning PAD into a dataset
  # shortcut.
  pad_identity_live_weight: 0.1
  pad_detach_identity_orth_on_pad: true
  pad_supcon_weight: 1.0
  pad_focal_alpha: 0.5
  pad_focal_gamma: 2.0
  pad_focal_weight: 0.0
  pad_hard_spoof_sensor_ids: [6]  # Swipe only; Unknown(8) intentionally excluded
  pad_hard_spoof_material_ids: [4, 6, 7]
  pad_hard_spoof_weight: 1.0
  pad_ohem_fraction: 0.0
  pad_ohem_weight: 1.0
  identity_supcon_weight: 0.0
  identity_arcface_weight: 1.0
  identity_label_smoothing: 0.1

# ─────────────────────────────────────────────────────────────────
# Optimizer — Phase-1 base x1.0; Phase-2 surgery applies the *_phase2
# multipliers (relative to base lr) at the dynamic transition.
# ─────────────────────────────────────────────────────────────────
optimizer:
  name: AdamW
  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]
  lr_multipliers:
    # Phase-1 effective multipliers
    gabor: 0.1
    gabor_pad: 0.0
    backbone_embed: 1.0
    backbone_early: 1.0
    backbone_late: 1.0
    moe_experts: 2.0
    identity_head: 0.0           # inactive during PAD foundation
    arcface: 0.0                 # inactive during PAD foundation
    pad_stem: 0.0                # MS-TAH no longer consumes PADStem
    pad_head: 1.0
    sensor_adv_head: 0.0
    # Phase-2 surgery targets (relative to base lr) — identity integration.
    gabor_phase2: 0.1
    gabor_pad_phase2: 0.0
    backbone_phase2: 1.0
    backbone_embed_phase2: 1.0
    backbone_early_phase2: 1.0
    backbone_late_phase2: 1.0
    moe_experts_phase2: 1.0
    identity_head_phase2: 1.0
    arcface_phase2: 1.0
    pad_stem_phase2: 0.0
    pad_head_phase2: 1.0
    sensor_adv_head_phase2: 0.0

scheduler:
  name: CosineAnnealingLR
  T_max: 120
  eta_min: 1.0e-06

# ─────────────────────────────────────────────────────────────────
# PAD-first phases
# ─────────────────────────────────────────────────────────────────
phases:
  phase1_task: pad
  phase1_max_epochs: 15
  phase2_epochs: 25
  total_epochs: 40
  transition_on_plateau: false
  phase2_freeze_identity: false
  patience: 5
  phase1_warmup_delay: 5
  phase1_warmup_epochs: 10
  arcface_scale_init: 1.0
  arcface_margin_init: 0.0
  arcface_margin_target: 0.5
  warmup_epochs: 10
  alpha_target: 1.0
  gamma_target: 1.0
  beta_target: 0.02
  alpha_adv_target: 0.0
  arcface_scale_start: 32.0
  arcface_scale_end: 64.0
  moe_temp_phase1: 2.0
  moe_temp_phase2_end: 1.0

callbacks:
  dynamic_phase:
    monitor: val/acer
    mode: min
    patience: 5
    min_delta: 1.0e-4
  early_stopping:
    enabled: false               # never stop — we transition instead
  swa:
    enabled: false

data:
  # ── DATA CHUẨN: FVC + NIST (required root) ──
  identity_data_root: /home/aiserver/works/fingerprint/PAD-joint/data/processed/identity_stage2_nist302a
  pad_data_root: /home/aiserver/works/fingerprint/dataset
  joint_data_root: ""
  identity_datasets: [nist_sd302a]
  pad_datasets: [LivDet2011, LivDet2013, LivDet2015]
  joint_datasets: []
  image_size: 224
  grayscale: true
  group_by_subject: true
  # Data-centric ID rebalance: force every identity batch to be
  # FVC/NIST class-balanced (NIST has ~70× more classes than FVC, so a
  # plain PKSampler made the 24M net overfit NIST and ignore FVC).
  balanced_identity_groups: true
  identity_fvc_ratio: 0.5        # 50/50 FVC:NIST classes per batch
  pk_p: 16
  pk_k: 2
  pad_batch_size: 128
  identity_num_views: 2
  identity_preset: fingerprint_hard
  num_workers: 8
  pin_memory: true
  val_split: 0.1

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 40
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  deterministic: false

checkpoint:
  dirpath: checkpoints_sa24_padfirst_arcface_livecal/
  monitor: val/acer
  mode: min
  phase2_monitor: val/acer
  phase2_mode: min
  identity_guard:
    enabled: false
    min_phase: 2
    require_metrics: true
    baseline_rank1: null         # optional override when starting directly from a Phase-1 ckpt
    baseline_tar_at_far: null
    # With --init-from onto the NIST302a identity root, the absolute rank-1
    # baseline is much lower than the old FVC/NIST Phase-1 validation. Guard
    # relative drift instead of enforcing a stale absolute 80% floor.
    min_rank1: null
    max_rank1_drop: 0.06
    max_tar_drop: 0.05

logging:
  name: omfr_sa24_padfirst_arcface_livecal
  save_dir: logs/
  version: 0
  wandb:
    enabled: true
    project: omfr
    name: sa24_padfirst_arcface_livecal
    log_model: false

evaluation:
  pad_threshold: 0.5
  cascade_pad_threshold: 0.35
  far: 1.0e-4
  cmc_max_rank: 10
  mrl_eval_dims: [64, 128, 256]

export:
  output_dir: exports/
  onnx_opset: 17
  input_shape: [1, 1, 224, 224]
  simplify: true
