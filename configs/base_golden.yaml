# configs/base.yaml — OMFR v2 Base Configuration (FastViT-SA12)
# All hyperparameters for OMFRModule, OMFRDataModule, Trainer, and evaluation.

# ─────────────────────────────────────────────────────────────────
# Model — Backbone (FastViT-SA12, ~10.5M)
# ─────────────────────────────────────────────────────────────────
backbone:
  name: fastvit_sa12         # FastViT-SA12 — RepMixer s0-s2 + Self-Attn s3
  pretrained: true           # Load ImageNet-1k distilled weights from timm
  in_chans: 8                # 8-channel Gabor stem input
  # FastViT-SA12 architecture (fixed, from timm):
  #   stage0: (B, 64, 56, 56)   2 x RepMixerBlock
  #   stage1: (B,128, 28, 28)   2 x RepMixerBlock
  #   stage2: (B,256, 14, 14)   6 x RepMixerBlock
  #   stage3: (B,512,  7,  7)   2 x AttentionBlock (multi-head self-attn)
  #
  # MoE insertion points (stage_idx, block_idx):
  #   Stage 1 block 1: 28×28 tokens, 128-ch   ('s2')
  #   Stage 2 block 2: 14×14 tokens, 256-ch   ('s3a')
  #   Stage 2 block 5: 14×14 tokens, 256-ch   ('s3b')
  num_experts: 4
  top_k: 2
  # Gradient checkpointing trades ~30% extra compute for ~2× lower
  # activation memory. Needed to fit Phase 2 (two head forwards +
  # orth loss) on a single GPU at batch 128.
  grad_checkpoint: true

# ─────────────────────────────────────────────────────────────────
# Model — Gabor Stem
# ─────────────────────────────────────────────────────────────────
gabor:
  n_orientations: 8
  kernel_size: 31
  init_frequency: 0.12       # ~5 cycles/mm at 500 DPI

# ─────────────────────────────────────────────────────────────────
# Model — Identity Head
# ─────────────────────────────────────────────────────────────────
identity_head:
  embed_dim: 256             # identity embedding dimension
  num_heads: 8               # structural attention heads
  grid_size: 14              # 14x14 token grid from FastVit stage2 (196 tokens)
  num_queries: 4             # attentive pooling query seeds
  stage3_dim: 256            # FastVit stage2 output dim (was 160 for TinyViT)
  stage4_dim: 512            # FastVit stage3 output dim (was 320 for TinyViT)
  mrl_dims: [64, 128, 256]
  num_classes: 5000          # Number of training identities (auto-detected)

# ─────────────────────────────────────────────────────────────────
# Model — PAD Head
# ─────────────────────────────────────────────────────────────────
pad_head:
  stage1_dim: 64             # TinyViT Stage 0 output dim
  stage2_dim: 128            # TinyViT Stage 1 output dim
  dropout: 0.1
  pad_features_dim: 128
  pad_embedding_dim: 32

# ─────────────────────────────────────────────────────────────────
# Losses
# ─────────────────────────────────────────────────────────────────
losses:
  arcface:
    margin: 0.5
    scale_phase1: 32.0       # gentle scale for Phase 1
    scale_final: 48.0        # full scale reached by end of Phase 2 warmup
    easy_margin: false
  supcon:
    temperature: 0.07
    contrast_mode: all
    base_temperature: 0.07
  orthogonality:
    eps: 1.0e-8
  # Loss weights
  alpha: 0.0                 # PAD loss weight (ramped in Phase 2)
  beta: 0.0                  # Orthogonality loss weight (ramped in Phase 2)
  gamma: 0.05                # Load-balance loss weight (up from 0.01 to combat imbalance)
  # PAD classification: BCE keeps the early signal stable; focal/OHEM and
  # hard-spoof weights emphasize difficult spoof subsets from LivDet.
  pad_bce_weight: 0.5
  pad_focal_alpha: 0.5
  pad_focal_gamma: 1.0
  pad_focal_weight: 1.0
  # Sensor ids follow PADDataset.SENSOR_NAMES; material ids follow
  # PADDataset.MATERIAL_NAMES. These weights only affect spoof samples.
  pad_hard_spoof_sensor_ids: [6]          # Swipe
  pad_hard_spoof_material_ids: [4, 6, 7]  # Latex, PlayDoh, WoodGlue
  pad_hard_spoof_weight: 2.0
  pad_ohem_fraction: 0.25
  pad_ohem_weight: 1.5
  # Hybrid identity loss — SupCon (open-set) + ArcFace (closed-set).
  # SupCon dominates so embeddings generalize to unseen FVC identities.
  identity_supcon_weight: 0.9
  identity_arcface_weight: 0.1

# ─────────────────────────────────────────────────────────────────
# Optimizer
# ─────────────────────────────────────────────────────────────────
optimizer:
  name: AdamW
  lr: 1.0e-4                 # base learning rate
  weight_decay: 0.05
  betas: [0.9, 0.999]
  # Differential LR multipliers per param group
  lr_multipliers:
    gabor: 0.1               # stable Gabor filters — low LR
    backbone_embed: 1.0      # patch embedding
    backbone_early: 1.0      # stages 0-1
    backbone_late: 1.0       # stages 2-3
    moe_experts: 2.0         # new params, need to catch up
    identity_head: 1.0
    pad_head_phase1: 1.0
    pad_head_phase2: 2.0     # higher LR in Phase 2
    arcface: 0.1             # reduced from 10x to prevent gradient explosion

scheduler:
  name: CosineAnnealingLR
  T_max: 60                  # total training epochs
  eta_min: 1.0e-6

# ─────────────────────────────────────────────────────────────────
# Training Phases
# ─────────────────────────────────────────────────────────────────
phases:
  phase1_epochs: 20           # Identity Foundation (smoke test: compressed)
  phase2_epochs: 20          # PAD Integration: epochs 20-39
  phase3_epochs: 20          # Joint Refinement: epochs 40-59
  total_epochs: 60            # smoke test compression

  # Phase 1 ArcFace warmup (prevents gradient explosion with many classes)
  phase1_warmup_delay: 5     # hold s=1, m=0 for first N epochs while LR warms up
  phase1_warmup_epochs: 5    # smoke test: compressed
  arcface_scale_init: 1.0    # gentle start
  arcface_margin_init: 0.0   # no angular margin initially
  arcface_margin_target: 0.5 # full margin by end of Phase 1 warmup

  # Phase 2 warmup for alpha/beta/arcface_scale ramps
  warmup_epochs: 5          
  alpha_target: 1.0
  # Orthogonality weight: reduced 0.1 -> 0.02 because β=0.1 was
  # visibly distorting the 256-D identity embedding (MRL 256 < 128
  # at eval). With separate Gabor banks and a beefed-up pad_stem,
  # PAD and identity already share less representation, so a lighter
  # decorrelation pressure suffices.
  beta_target: 0.02
  # TASK_03/04: DANN sensor-adversarial weight on pad_features. Ramped
  # by cosine over FULL Phase 2; lam_adv (GRL strength) uses sigmoid.
  alpha_adv_target: 0.0      # DANN DISABLED (ablation smoke test)
  arcface_scale_start: 32.0
  arcface_scale_end: 48.0

  # MoE temperature schedule
  moe_temp_phase1: 2.0       # soft routing (exploration)
  moe_temp_phase2_end: 1.0   # gradual sharpening
  moe_temp_phase3_end: 0.5   # sharp routing (specialization)

# ─────────────────────────────────────────────────────────────────
# DataModule
# ─────────────────────────────────────────────────────────────────
data:
  # Dataset roots
  identity_data_root: /home/linhdang/workspace2/NIST-300-ds/combined_nist
  pad_data_root: /home/linhdang/workspace2/PAD-joint
  joint_data_root: ""

  # Supported identity datasets: fvc2004, nist_sd302, nist_sd300, nist_sd302a
  identity_datasets: [nist_sd300]
  # Supported PAD datasets: livdet2013, livdet2015, livdet2017
  pad_datasets: [LivDet2013, LivDet2015]
  # Supported joint datasets: msu_fpad
  joint_datasets: []

  image_size: 224
  grayscale: true            # load as single-channel
  # Group NIST SD300 folders by subject (merge frgp_01..10 per subject)
  # to reduce class count from ~10,300 → ~1,030 with ~20 samples/class.
  group_by_subject: true

  # PKSampler settings (Phase 1 / Phase 2 identity loader)
  pk_p: 32                   # identities per batch
  # TASK_06: multi-view SupCon doubles effective samples per identity,
  # so pk_k halved (32 * 2 * 2 = 128 total, same memory).
  pk_k: 2                    # samples per identity (× num_views)
  # BalancedPADSampler (Phase 2 PAD loader)
  # Cut 128 -> 64 because Phase-2 joint step runs TWO backbone forwards
  # (id + pad) per optimizer step; 128 PAD samples on an 11 GiB card
  # OOMs at the epoch-20 boundary even with the pad-backbone no_grad
  # optimization. 32 live + 32 spoof is still balanced.
  pad_batch_size: 64         # 50/50 live/spoof

  # TASK_06: FVC-mimicking augmentation + multi-view SupCon for identity
  # open-set transfer. Each sample yields `identity_num_views` augmented
  # copies stacked as (V, C, H, W); OMFRModule flattens to (B*V, ...)
  # with labels repeated so SupCon/ArcFace see independent views.
  identity_num_views: 2
  identity_preset: fingerprint_hard

  num_workers: 8
  pin_memory: true
  val_split: 0.1             # fraction of data held out for validation

# ─────────────────────────────────────────────────────────────────
# Trainer
# ─────────────────────────────────────────────────────────────────
trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 60               
  gradient_clip_val: 0.5
  accumulate_grad_batches: 2   # effective batch ≈ 256
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  deterministic: false         # reproducible but slower if true

# ─────────────────────────────────────────────────────────────────
# Checkpointing & Logging
# ─────────────────────────────────────────────────────────────────
checkpoint:
  dirpath: checkpoints/
  filename: omfr-{epoch:03d}-{val/cascaded_IM:.4f}
  monitor: val/cascaded_IM
  mode: max
  save_top_k: 3
  save_last: true

logging:
  name: omfr
  save_dir: logs/
  version: null              # null → auto-increment
  wandb:
    enabled: true
    project: omfr
    name: null                # null → auto-generated run name
    log_model: false          # set true to upload checkpoints to wandb

# ─────────────────────────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────────────────────────
evaluation:
  pad_threshold: 0.5
  far: 1.0e-4                # FAR target for TAR@FAR (= 0.01%)
  cmc_max_rank: 10
  mrl_eval_dims: [64, 128, 256]

# ─────────────────────────────────────────────────────────────────
# Export
# ─────────────────────────────────────────────────────────────────
export:
  output_dir: exports/
  onnx_opset: 17
  input_shape: [1, 1, 224, 224]   # (B, C, H, W) — grayscale
  simplify: true                  # run onnx-simplifier if available
