# configs/base.yaml — OMFR Base Configuration
# All hyperparameters for OMFRModule, OMFRDataModule, Trainer, and evaluation.
# Override individual keys in phase-specific configs.

# ─────────────────────────────────────────────────────────────────
# Model — Backbone
# ─────────────────────────────────────────────────────────────────
backbone:
  img_size: 224
  patch_size: 16
  in_chans: 3          # input to ViT after Gabor stem
  embed_dim: 192
  depth: 12
  num_heads: 3
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  moe_layers: [3, 7, 10]    # 1-indexed transformer layers with MoE-FFN
  num_experts: 4
  top_k: 2

# ─────────────────────────────────────────────────────────────────
# Model — Gabor Stem
# ─────────────────────────────────────────────────────────────────
gabor:
  n_orientations: 8
  n_frequencies: 4
  kernel_size: 31
  learnable: true

# ─────────────────────────────────────────────────────────────────
# Model — Identity Head
# ─────────────────────────────────────────────────────────────────
identity_head:
  embed_dim: 256
  num_heads: 4
  grid_size: 14          # 14×14 token grid from 224/16
  token_dim: 192         # ViT embed_dim
  mrl_dims: [64, 128, 256]
  num_classes: 5000      # Number of training identities (update per dataset)

# ─────────────────────────────────────────────────────────────────
# Model — PAD Head
# ─────────────────────────────────────────────────────────────────
pad_head:
  token_dim: 192
  dropout: 0.1
  pad_features_dim: 128
  pad_embedding_dim: 32

# ─────────────────────────────────────────────────────────────────
# Losses
# ─────────────────────────────────────────────────────────────────
losses:
  arcface:
    margin: 0.5
    scale_phase1: 32.0   # gentle scale for Phase 1
    scale_final: 64.0    # full scale reached by end of Phase 2 warmup
    easy_margin: false
  supcon:
    temperature: 0.07
    contrast_mode: all
    base_temperature: 0.07
  orthogonality:
    eps: 1.0e-8
  # Loss weights
  alpha: 0.0             # PAD loss weight (ramped in Phase 2)
  beta: 0.0              # Orthogonality loss weight (ramped in Phase 2)
  gamma: 0.01            # Load-balance loss weight (fixed, always active)

# ─────────────────────────────────────────────────────────────────
# Optimizer
# ─────────────────────────────────────────────────────────────────
optimizer:
  name: AdamW
  lr: 1.0e-4             # base learning rate
  weight_decay: 0.05
  betas: [0.9, 0.999]
  # Differential LR multipliers per param group
  lr_multipliers:
    gabor: 0.1           # stable Gabor filters — low LR
    backbone_early: 1.0  # ViT layers 1-6
    backbone_late: 1.0   # ViT layers 7-12
    moe_experts: 2.0     # new params, need to catch up
    identity_head: 1.0
    pad_head_phase1: 1.0
    pad_head_phase2: 2.0 # higher LR in Phase 2
    arcface: 10.0        # large, sparse gradients

scheduler:
  name: CosineAnnealingLR
  T_max: 60              # total training epochs
  eta_min: 1.0e-6

# ─────────────────────────────────────────────────────────────────
# Training Phases
# ─────────────────────────────────────────────────────────────────
phases:
  phase1_epochs: 20      # Identity Foundation: epochs 0-19
  phase2_epochs: 20      # PAD Integration: epochs 20-39
  phase3_epochs: 20      # Joint Refinement: epochs 40-59
  total_epochs: 60

  # Phase 2 warmup for alpha/beta/arcface_scale ramps
  warmup_epochs: 5       # over first 5 epochs of Phase 2
  alpha_target: 1.0
  beta_target: 0.1
  arcface_scale_start: 32.0
  arcface_scale_end: 64.0

# ─────────────────────────────────────────────────────────────────
# DataModule
# ─────────────────────────────────────────────────────────────────
data:
  # Dataset roots — set via environment or override in local config
  identity_data_root: /data/fingerprint/identity
  pad_data_root: /data/fingerprint/pad
  joint_data_root: /data/fingerprint/joint

  # Supported identity datasets: fvc2004, nist_sd302, nist_sd300, nist_sd302a
  identity_datasets: [fvc2004, nist_sd302]
  # Supported PAD datasets: livdet2013, livdet2015, livdet2017
  pad_datasets: [livdet2015, livdet2017]
  # Supported joint datasets: msu_fpad
  joint_datasets: [msu_fpad]

  image_size: 224
  grayscale: true        # load as single-channel

  # PKSampler settings (Phase 1 / Phase 2 identity loader)
  pk_p: 32               # identities per batch
  pk_k: 4                # samples per identity → batch_size = 128
  # BalancedPADSampler (Phase 2 PAD loader)
  pad_batch_size: 128    # 50/50 live/spoof

  num_workers: 8
  pin_memory: true
  val_split: 0.1         # fraction of data held out for validation

# ─────────────────────────────────────────────────────────────────
# Trainer
# ─────────────────────────────────────────────────────────────────
trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 60
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2   # effective batch ≈ 256
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  deterministic: false         # reproducible but slower if true

# ─────────────────────────────────────────────────────────────────
# Checkpointing & Logging
# ─────────────────────────────────────────────────────────────────
checkpoint:
  dirpath: checkpoints/
  filename: omfr-{epoch:03d}-{val/cascaded_IM:.4f}
  monitor: val/cascaded_IM
  mode: max
  save_top_k: 3
  save_last: true

logging:
  # TensorBoard by default; set name/version as needed
  name: omfr
  save_dir: logs/
  version: null          # null → auto-increment

# ─────────────────────────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────────────────────────
evaluation:
  pad_threshold: 0.5
  far: 1.0e-4            # FAR target for TAR@FAR (= 0.01%)
  cmc_max_rank: 10
  mrl_eval_dims: [64, 128, 256]

# ─────────────────────────────────────────────────────────────────
# Export
# ─────────────────────────────────────────────────────────────────
export:
  output_dir: exports/
  onnx_opset: 17
  input_shape: [1, 1, 224, 224]   # (B, C, H, W) — grayscale
  simplify: true                  # run onnx-simplifier if available
